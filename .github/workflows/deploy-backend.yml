name: Test and Deploy Backend to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select DEPLOY_OVH_PRODUCTION to authorize the production deployment
        required: true
        default: DO_NOT_DEPLOY
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_OVH_PRODUCTION

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wishkr
          POSTGRES_PASSWORD: wishkr
          POSTGRES_DB: wishkr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wishkr -d wishkr_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://wishkr:wishkr@localhost:5432/wishkr_test
      SYNC_DATABASE_URL: postgresql://wishkr:wishkr@localhost:5432/wishkr_test
      ENABLE_SHARED_WISHLIST: "false"
      PREFERENCE_OUTBOUND_ENABLED: "false"
      PREFERENCE_INTERCEPTOR_ENABLED: "false"
      LLM_DAILY_BUDGET_USD: "5"
      LLM_MONTHLY_BUDGET_USD: "100"
      LLM_PER_USER_DAILY_BUDGET_USD: "1"
      HUBBLE_ENABLED: "false"
      HUBBLE_FAIL_STARTUP_ON_AUTH_ERROR: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          pip install "psycopg[binary]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    name: Deploy OVH production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'DEPLOY_OVH_PRODUCTION'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    environment: production

    env:
      SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      OVH_HOST: ${{ secrets.OVH_HOST }}
      DEPLOY_USER: ${{ secrets.OVH_DEPLOY_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
      WIREGUARD_CONFIG: ${{ secrets.OVH_WIREGUARD_CONFIG }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "${SSH_KEY:-}" ] || missing+=(OVH_SSH_KEY)
          [ -n "${OVH_HOST:-}" ] || missing+=(OVH_HOST)
          [ -n "${DEPLOY_USER:-}" ] || missing+=(OVH_DEPLOY_USER)
          [ -n "${SSH_KNOWN_HOSTS:-}" ] || missing+=(OVH_SSH_KNOWN_HOSTS)
          [ -n "${WIREGUARD_CONFIG:-}" ] || missing+=(OVH_WIREGUARD_CONFIG)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: required production secrets are missing: ${missing[*]}"
            exit 1
          fi

          if [[ ! "$RELEASE_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "ERROR: invalid release identifier"
            exit 1
          fi

      - name: Connect dedicated deployment VPN peer
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wireguard-tools

          wg_config="$RUNNER_TEMP/wishkr-ci.conf"
          printf '%s\n' "$WIREGUARD_CONFIG" > "$wg_config"
          chmod 600 "$wg_config"
          sudo wg-quick up "$wg_config"

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$OVH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Verify OVH deployment boundary
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$OVH_HOST" \
            'sudo -n /usr/local/sbin/wishkr-deploy-release --preflight'

      - name: Build immutable release archive
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/wishkr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          git archive --format=tar.gz --prefix=release/ --output="$archive" "$GITHUB_SHA"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"

          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"
          echo "ARCHIVE_SHA256=$archive_sha256" >> "$GITHUB_ENV"
          echo "REMOTE_ARCHIVE=/var/tmp/wishkr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload and deploy release
        shell: bash
        run: |
          set -euo pipefail

          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )

          scp "${ssh_options[@]}" "$ARCHIVE_PATH" \
            "$DEPLOY_USER@$OVH_HOST:$REMOTE_ARCHIVE"

          ssh "${ssh_options[@]}" "$DEPLOY_USER@$OVH_HOST" \
            "chmod 600 '$REMOTE_ARCHIVE' && sudo -n /usr/local/sbin/wishkr-deploy-release '$REMOTE_ARCHIVE' '$ARCHIVE_SHA256' '$RELEASE_ID' '$GITHUB_SHA'"

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://api.wishkr.com/health >/dev/null; then
              echo "Public health check passed"
              exit 0
            fi
            echo "Public health attempt $attempt failed; retrying"
            sleep 5
          done

          echo "ERROR: public health check failed"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "OVH release deployed: $RELEASE_ID"
          echo "Public health result: passed"

      - name: Cleanup deployment credentials and VPN
        if: always()
        shell: bash
        run: |
          set +e
          sudo wg-quick down "$RUNNER_TEMP/wishkr-ci.conf" 2>/dev/null || true
          rm -f "$HOME/.ssh/deploy_key" "$RUNNER_TEMP/wishkr-ci.conf" "${ARCHIVE_PATH:-}"
