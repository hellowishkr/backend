name: wishkr

x-app-security: &app-security
  init: true
  user: "1001:1001"
  read_only: true
  stop_signal: SIGTERM
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    build:
      context: ./ops/images/postgres
    image: wishkr-postgres:16.14-alpine3.24.1
    container_name: wishkr-db-1
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wishkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-wishkr}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - autovacuum_work_mem=256MB
      - -c
      - effective_io_concurrency=200
      - -c
      - maintenance_io_concurrency=100
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=on
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/wishkr-pg_hba.conf
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=1000ms
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
      - -c
      - log_autovacuum_min_duration=1000ms
      - -c
      - log_line_prefix=%m [%p] %q%u@%d/%a
      - -c
      - log_statement=none
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /var/run/postgresql:rw,nosuid,nodev,uid=70,gid=70,mode=3775,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    cpus: 3.0
    mem_limit: 20g
    mem_reservation: 4g
    shm_size: 1g
    stop_grace_period: 90s
    stop_signal: SIGTERM
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: wishkr-redis-1
    restart: unless-stopped
    user: "999:1000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -ec
      - >-
        umask 077;
        printf 'protected-mode yes\nmaxmemory 1gb\nmaxmemory-policy allkeys-lru\nsave 3600 1 300 100 60 10000\nappendonly yes\nappendfsync everysec\naof-use-rdb-preamble yes\nauto-aof-rewrite-percentage 100\nauto-aof-rewrite-min-size 64mb\nrdbcompression yes\nrdbchecksum yes\nstop-writes-on-bgsave-error yes\nrequirepass %s\n'
        "$${REDIS_PASSWORD}" > /tmp/redis.conf;
        unset REDIS_PASSWORD;
        exec redis-server
        /tmp/redis.conf
    volumes:
      - redisdata:/data
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 256m
    stop_grace_period: 30s
    stop_signal: SIGTERM
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  backend:
    <<: *app-security
    container_name: wishkr-backend-1
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: wishkr-backend:${GIT_SHA:-migration}
    restart: unless-stopped
    env_file:
      - ${WISHKR_ENV_FILE:-/etc/wishkr/secrets/production.env}
    environment:
      APP_ROLE: web
      RUN_SCHEDULER: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      APP_ENV: production
      GIT_SHA: ${GIT_SHA:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    ports:
      - 127.0.0.1:8000:8000
    cpus: 3.0
    mem_limit: 4g
    mem_reservation: 512m
    logging: *default-logging
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers "$${WEB_WORKERS:-1}" --proxy-headers
        --forwarded-allow-ips=127.0.0.1
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8000/health
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  scheduler:
    <<: *app-security
    container_name: wishkr-scheduler-1
    image: wishkr-backend:${GIT_SHA:-migration}
    restart: unless-stopped
    env_file:
      - ${WISHKR_ENV_FILE:-/etc/wishkr/secrets/production.env}
    environment:
      APP_ROLE: scheduler
      RUN_SCHEDULER: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      APP_ENV: production
      GIT_SHA: ${GIT_SHA:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 256m
    pids_limit: 256
    logging: *default-logging
    command:
      - python
      - -m
      - app.scheduler_worker
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/wishkr-scheduler-worker.ready
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  app:
    external: true
    name: wishkr-app
  data:
    external: true
    name: wishkr-data

volumes:
  pgdata:
    name: wishkr_pgdata
    labels:
      com.wishkr.purpose: postgres-production-data
  redisdata:
    name: wishkr_redisdata
    labels:
      com.wishkr.purpose: redis-production-data
