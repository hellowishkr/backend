services:
  backend:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ROLE: web
      RUN_SCHEDULER: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set in .env}
      APP_ENV: ${APP_ENV:-production}
      ENABLE_SHARED_WISHLIST: ${ENABLE_SHARED_WISHLIST:-false}
      PREFERENCE_OUTBOUND_ENABLED: ${PREFERENCE_OUTBOUND_ENABLED:-false}
      PREFERENCE_INTERCEPTOR_ENABLED: ${PREFERENCE_INTERCEPTOR_ENABLED:-false}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-5}
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-100}
      LLM_PER_USER_DAILY_BUDGET_USD: ${LLM_PER_USER_DAILY_BUDGET_USD:-1}
      GIT_SHA: ${GIT_SHA:-}
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "
      alembic upgrade head || exit 1;
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_WORKERS:-1} --proxy-headers --forwarded-allow-ips='*'
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
