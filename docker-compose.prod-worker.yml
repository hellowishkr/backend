services:
  scheduler:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ROLE: scheduler
      RUN_SCHEDULER: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set in .env}
      APP_ENV: ${APP_ENV:-production}
      ENABLE_SHARED_WISHLIST: ${ENABLE_SHARED_WISHLIST:-false}
      PREFERENCE_OUTBOUND_ENABLED: ${PREFERENCE_OUTBOUND_ENABLED:-false}
      PREFERENCE_INTERCEPTOR_ENABLED: ${PREFERENCE_INTERCEPTOR_ENABLED:-false}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-5}
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-100}
      LLM_PER_USER_DAILY_BUDGET_USD: ${LLM_PER_USER_DAILY_BUDGET_USD:-1}
      GIT_SHA: ${GIT_SHA:-}
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "app.scheduler_worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/wishkr-scheduler-worker.ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
