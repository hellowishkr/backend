# Managed Wishkr software-RAID configuration.

HOMEHOST <system>

# mdadm invokes this program for every interesting monitor event. Alerts are
# written to journald and will be collected by the host monitoring stack.
PROGRAM /usr/local/sbin/wishkr-mdadm-alert

ARRAY /dev/md/md2 metadata=1.2 UUID=ce588b51:bb57b4cf:438267d0:704cb31b
ARRAY /dev/md/md3 metadata=1.2 UUID=4cdd718a:e37e3b59:d3eaa16b:1c876469
