# Discover and monitor all SMART-capable devices.
#
# -a              Monitor health, usage attributes, and device error/self-test
#                 information supported by each device type.
# -n standby,15,q Avoid waking sleeping media; force a check after 15 skipped
#                 intervals and suppress routine skip messages.
# -W 4,70,80      Log temperature changes >=4 C, an informational warning at
#                 70 C, and a critical warning at 80 C.
#
# Warnings are written to journald/syslog and will be collected by the host
# monitoring stack. No local MTA is installed, so do not use "-m root".
DEVICESCAN -a -n standby,15,q -W 4,70,80
