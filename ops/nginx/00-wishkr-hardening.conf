# Loaded in nginx's http context from /etc/nginx/conf.d.
# No credential or request body is logged by this configuration.

server_tokens off;

client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 120s;
keepalive_timeout 65s;
keepalive_requests 1000;
reset_timedout_connection on;

limit_req_status 429;
limit_conn_status 429;

# Per-client controls. cloudflare-realip.conf replaces $remote_addr only when
# CF-Connecting-IP arrived from an official Cloudflare network.
limit_req_zone $binary_remote_addr zone=wishkr_api_per_ip:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=wishkr_health_per_ip:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=wishkr_login_per_ip:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=wishkr_conn_per_ip:10m;

# Only loopback and the WireGuard administration subnet may bypass Cloudflare
# mTLS. This keeps staged validation possible without creating a public bypass.
geo $wishkr_admin_source {
    default       0;
    127.0.0.1/32  1;
    ::1/128       1;
    10.77.0.0/24  1;
}

# Cloudflare requests must present the Authenticated Origin Pull certificate.
# VPN/loopback operators may connect without one. Invalid client certificates
# are never accepted.
map "$ssl_client_verify:$wishkr_admin_source" $wishkr_origin_authorized {
    default        0;
    ~^SUCCESS:     1;
    "NONE:1"       1;
}

# $uri intentionally excludes the query string. Meta's one-time webhook
# verification request contains a secret verify token in its query parameters.
log_format wishkr_json escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"request_id":"$request_id",'
    '"cf_ray":"$http_cf_ray"}';

# Dedicated monitoring log: numeric timestamp and response status only. This
# contains no client address, method, host, URI, request ID, header, or payload.
log_format wishkr_metrics '$msec $status';
