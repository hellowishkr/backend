# Unknown TLS server names are rejected before an HTTP request is processed.
server {
    listen 0.0.0.0:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 0.0.0.0:443 ssl;
    server_name api.wishkr.com;

    ssl_certificate /etc/wishkr/tls/api.wishkr.com-origin.pem;
    ssl_certificate_key /etc/wishkr/tls/api.wishkr.com-origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1;
    ssl_session_cache shared:WishkrTLS:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Global Cloudflare Authenticated Origin Pull CA. The request gate below
    # requires SUCCESS for public traffic while retaining VPN-only validation.
    ssl_client_certificate /etc/wishkr/tls/cloudflare-origin-pull-ca.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    if ($wishkr_origin_authorized = 0) {
        return 403;
    }

    access_log /var/log/nginx/wishkr-api-access.log wishkr_json;
    error_log /var/log/nginx/wishkr-api-error.log warn;

    client_max_body_size 12m;
    limit_conn wishkr_conn_per_ip 40;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;

    location = /health {
        limit_req zone=wishkr_health_per_ip burst=20 nodelay;
        include /etc/nginx/snippets/wishkr-proxy.conf;
    }

    # Webhook payloads retain application-level HMAC verification. Do not use
    # the generic low-rate login limiter here: Meta and Razorpay retry in bursts.
    location ^~ /webhooks/ {
        client_max_body_size 2m;
        include /etc/nginx/snippets/wishkr-proxy.conf;
    }

    # Operational endpoints are reachable only while connected to WireGuard.
    location ^~ /internal/ {
        allow 127.0.0.1;
        allow 10.77.0.0/24;
        deny all;
        include /etc/nginx/snippets/wishkr-proxy.conf;
    }

    location = /api/admin/settings/auth/login {
        limit_req zone=wishkr_login_per_ip burst=5 nodelay;
        include /etc/nginx/snippets/wishkr-proxy.conf;
    }

    location ^~ /api/ {
        limit_req zone=wishkr_api_per_ip burst=120 nodelay;
        include /etc/nginx/snippets/wishkr-proxy.conf;
    }

    location / {
        client_max_body_size 2m;
        limit_req zone=wishkr_api_per_ip burst=120 nodelay;
        include /etc/nginx/snippets/wishkr-proxy.conf;
    }
}
