# Loopback-only Nginx counters for the local monitoring exporter. The endpoint
# exposes aggregate connection/request numbers only and writes no access log.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    access_log off;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 404;
    }
}
